<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Quiz</title>
<style>
  /* Tokens: use the host's theme variables when it provides them, else fall back. */
  :root {
    --bg: var(--color-background-primary, #ffffff);
    --bg2: var(--color-background-secondary, #f5f5f4);
    --fg: var(--color-text-primary, #1c1917);
    --fg2: var(--color-text-secondary, #57534e);
    --line: var(--color-border-primary, #d6d3d1);
    --accent: #2563eb;
    --good: #15803d;
    --bad: #b91c1c;
    --font: var(--font-sans, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: var(--color-background-primary, #1c1917);
      --bg2: var(--color-background-secondary, #292524);
      --fg: var(--color-text-primary, #fafaf9);
      --fg2: var(--color-text-secondary, #a8a29e);
      --line: var(--color-border-primary, #44403c);
      --accent: #60a5fa;
      --good: #4ade80;
      --bad: #f87171;
    }
  }
  :root[data-theme="light"] {
    --bg: var(--color-background-primary, #ffffff);
    --bg2: var(--color-background-secondary, #f5f5f4);
    --fg: var(--color-text-primary, #1c1917);
    --fg2: var(--color-text-secondary, #57534e);
    --line: var(--color-border-primary, #d6d3d1);
    --accent: #2563eb; --good: #15803d; --bad: #b91c1c;
  }
  :root[data-theme="dark"] {
    --bg: var(--color-background-primary, #1c1917);
    --bg2: var(--color-background-secondary, #292524);
    --fg: var(--color-text-primary, #fafaf9);
    --fg2: var(--color-text-secondary, #a8a29e);
    --line: var(--color-border-primary, #44403c);
    --accent: #60a5fa; --good: #4ade80; --bad: #f87171;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.5;
  }
  #app { max-width: 640px; margin: 0 auto; padding: 16px; }

  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: var(--fg2); font-size: 13px; }
  .meta .grow { flex: 1; }
  .chip { border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; font-size: 12px; text-transform: capitalize; }
  .bar { height: 6px; background: var(--bg2); border-radius: 999px; overflow: hidden; margin: 10px 0 18px; }
  .bar > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }

  h1, h2 { margin: 0; line-height: 1.3; }
  h2.question { font-size: 18px; font-weight: 600; margin-bottom: 14px; }

  .choices { display: grid; gap: 8px; }
  .choice {
    display: flex; gap: 12px; align-items: flex-start; width: 100%; text-align: left;
    background: var(--bg); color: var(--fg); font: inherit;
    border: 1.5px solid var(--line); border-radius: 10px; padding: 11px 13px; cursor: pointer;
    transition: border-color .12s ease, background-color .12s ease;
  }
  .choice:hover:not([aria-disabled="true"]) { border-color: var(--accent); background: var(--bg2); }
  .choice:focus-visible, .btn:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .choice[aria-disabled="true"] { cursor: default; }
  .letter {
    flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
    border: 1.5px solid var(--line); font-size: 12px; font-weight: 600; color: var(--fg2);
  }
  .choice .text { padding-top: 1px; }
  .choice.correct { border-color: var(--good); background: color-mix(in srgb, var(--good) 14%, var(--bg)); }
  .choice.correct .letter { background: var(--good); border-color: var(--good); color: var(--bg); }
  .choice.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 14%, var(--bg)); }
  .choice.wrong .letter { background: var(--bad); border-color: var(--bad); color: var(--bg); }

  .feedback {
    margin-top: 14px; padding: 11px 13px; border-radius: 10px; background: var(--bg2);
    border-left: 4px solid var(--line);
  }
  .feedback.good { border-left-color: var(--good); }
  .feedback.bad { border-left-color: var(--bad); }
  .feedback .verdict { font-weight: 600; }
  .feedback.good .verdict { color: color-mix(in srgb, var(--good) 75%, var(--fg)); }
  .feedback.bad .verdict { color: color-mix(in srgb, var(--bad) 75%, var(--fg)); }
  .feedback p { margin: 4px 0 0; color: var(--fg2); }

  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer; border-radius: 9px; padding: 9px 16px;
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--bg);
  }
  .btn.secondary { background: transparent; color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .hint { color: var(--fg2); font-size: 12px; margin-top: 12px; }

  .score { text-align: center; padding: 8px 0 4px; }
  .score .big { font-size: 48px; font-weight: 700; line-height: 1.1; }
  .score .pct { color: var(--fg2); font-size: 15px; }
  .score .msg { margin-top: 6px; font-size: 16px; font-weight: 600; }
  .review { margin-top: 18px; display: grid; gap: 8px; }
  details { border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; }
  summary { cursor: pointer; padding: 10px 0; display: flex; gap: 10px; align-items: flex-start; list-style: none; }
  summary::-webkit-details-marker { display: none; }
  .mark { flex: none; font-weight: 700; width: 18px; }
  .mark.good { color: var(--good); }
  .mark.bad { color: var(--bad); }
  .detail { padding: 0 0 12px 28px; color: var(--fg2); font-size: 14px; }
  .detail div + div { margin-top: 3px; }
  .detail strong { color: var(--fg); }
  .status { color: var(--fg2); font-size: 13px; align-self: center; }
  .empty { color: var(--fg2); padding: 24px 0; text-align: center; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  @media (max-width: 420px) { #app { padding: 12px; } h2.question { font-size: 17px; } }
</style>
</head>
<body>
<div id="app"><p class="empty">Loading quiz…</p></div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
